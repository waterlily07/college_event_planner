<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}College Event Planner{% endblock %}</title>
  <script>
    // Set theme before first paint so there is no flash of the wrong colours.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">🎉 College Event Planner</a>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint in ('index','event_detail') }}">Events</a>
        <a href="{{ url_for('add_event') }}" class="{{ 'active' if request.endpoint == 'add_event' }}">Add Event</a>
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
      </nav>
      <button id="theme-toggle" type="button" aria-label="Switch between day and night mode">🌙 Night</button>
    </div>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Made with 💗 · College Event Planner</footer>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
